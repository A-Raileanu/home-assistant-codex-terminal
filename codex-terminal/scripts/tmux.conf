# Enable mouse support so the scroll wheel works inside the web terminal (ttyd).
# Scrolling up scrolls back through the pane history / Codex conversation;
# hold Shift to fall back to the browser's native text selection and copy.
set -g mouse on
set -g history-limit 50000
set -g status on
set -g status-interval 5
set -g status-style bg=colour236,fg=colour250
set -g window-status-current-style bg=colour37,fg=colour16
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour37
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"
