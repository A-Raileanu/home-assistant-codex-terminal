---
name: "Codex Terminal"
description: "Terminal with OpenAI Codex CLI, persistent auth, Home Assistant context, and MCP"
version: "1.0.3"
slug: "codex_terminal"
init: false

arch:
  - aarch64
  - amd64
  - armv7

url: "https://github.com/A-Raileanu/home-assistant-codex-terminal"

ingress: true
ingress_port: 7681
panel_icon: mdi:code-braces
panel_title: "Codex Terminal"
panel_admin: true

ports:
  7681/tcp: null
ports_description:
  7681/tcp: "Web terminal (not required for ingress)"

options:
  auto_launch_codex: true
  ha_smart_context: true
  ha_context_refresh_minutes: 30
  context_detail_level: "standard"
  include_addon_logs: false
  enable_ha_mcp: true
  mcp_mode: "ha-mcp"
  official_mcp_url: "http://supervisor/core/api/mcp"
  ha_mcp_version: "3.5.1"
  readonly_mode: false
  require_backup_before_edit: true
  enable_device_control: false
  enable_file_tools: true
  enable_yaml_editing: true
  codex_full_permissions: true
  max_log_lines: 80
  safe_edit_backup_retention_days: 30
  persistent_apk_packages: []
  persistent_pip_packages: []
schema:
  auto_launch_codex: bool?
  ha_smart_context: bool?
  ha_context_refresh_minutes: int(1,1440)?
  context_detail_level: list(summary|standard|full)?
  include_addon_logs: bool?
  enable_ha_mcp: bool? # deprecated: prefer mcp_mode: disabled
  mcp_mode: list(ha-mcp|official|both|disabled)?
  official_mcp_url: str?
  ha_mcp_version: str?
  readonly_mode: bool?
  require_backup_before_edit: bool?
  enable_device_control: bool?
  enable_file_tools: bool?
  enable_yaml_editing: bool?
  codex_full_permissions: bool?
  max_log_lines: int(10,500)?
  safe_edit_backup_retention_days: int(1,365)?
  persistent_apk_packages:
    - str
  persistent_pip_packages:
    - str

map:
  - config:rw

hassio_api: true
hassio_role: manager
homeassistant_api: true
auth_api: true

startup: services
webui: http://[HOST]:[PORT:7681]/
