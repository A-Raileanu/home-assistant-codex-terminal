---
name: "Codex Terminal"
description: "Terminal with OpenAI Codex CLI, persistent auth, Home Assistant context, and MCP"
version: "0.2.1"
slug: "codex_terminal"
init: false

arch:
  - aarch64
  - amd64
  - armv7

url: "https://github.com/openai/codex"

ingress: true
ingress_port: 7681
panel_icon: mdi:code-braces
panel_title: "Codex Terminal"
panel_admin: true

ports:
  7681/tcp: null
ports_description:
  7681/tcp: "Web terminal (not required for ingress)"

options:
  auto_launch_codex: true
  ha_smart_context: true
  ha_context_refresh_minutes: 30
  enable_ha_mcp: true
  mcp_mode: "ha-mcp"
  official_mcp_url: "http://supervisor/core/api/mcp"
  readonly_mode: false
  require_backup_before_edit: true
  enable_device_control: false
  enable_file_tools: true
  enable_yaml_editing: true
  max_log_lines: 80
  persistent_apk_packages: []
  persistent_pip_packages: []
schema:
  auto_launch_codex: bool?
  ha_smart_context: bool?
  ha_context_refresh_minutes: int?
  enable_ha_mcp: bool?
  mcp_mode: str?
  official_mcp_url: str?
  readonly_mode: bool?
  require_backup_before_edit: bool?
  enable_device_control: bool?
  enable_file_tools: bool?
  enable_yaml_editing: bool?
  max_log_lines: int?
  persistent_apk_packages:
    - str
  persistent_pip_packages:
    - str

map:
  - config:rw

hassio_api: true
hassio_role: manager
homeassistant_api: true
auth_api: true

startup: services
webui: http://[HOST]:[PORT:7681]/
