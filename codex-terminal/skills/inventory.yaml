# -----------------------------------------------------------------------------
# DEVICES — câte o intrare per device fizic.
#
# Câmpuri:
#   device_name        Numele final, format `[Cameră] Producător Model [#N]`
#   area               Match cu areas[].name
#   manufacturer       Producător, scriere oficială
#   model              Model, scriere oficială
#   identifier         MAC / serial / IEEE address — disambiguator între device-uri identice
#   integration        Integrarea HA (shelly, zha, mqtt, reolink, ...)
#   labels             Listă de slug-uri din `labels:` top-level
#   notes              (optional) Context util — ce controlează exact, particularități,
#                      dezambiguare între multipli device-uri identice (`#1` = plafonieră, `#2` = bandă LED)
#   renamed_at         Data ultimei redenumiri (YYYY-MM-DD)
#   previous_name      Numele anterior (cel mai recent)
#   entities[]         Lista entităților device-ului
#     entity_id        Entity_id curent
#     name             Entity friendly name (partea moștenită); `None` dacă entitatea e principală
#     previous_entity_id (optional)
#     enabled          (optional, default true) `false` dacă entitatea a fost dezactivată
#                      post-import — vezi `ha-entities.md` secțiunea Post-redenumire
# -----------------------------------------------------------------------------

devices: []

# -----------------------------------------------------------------------------
# ARCHIVED DEVICES — device-uri eliminate fizic; păstrate pentru istoric și
# pentru a recunoaște referințe vechi în automatizări.
# -----------------------------------------------------------------------------

archived_devices: []

# -----------------------------------------------------------------------------
# CHANGE LOG — append-only. O intrare per sesiune de redenumiri.
#
# Câmpuri:
#   date                YYYY-MM-DD
#   session             Titlu scurt al sesiunii
#   devices_touched     Listă cu device_name (cele finale) atinse în sesiune
#   labels_added        (optional) Labels noi adăugate în această sesiune
#   entities_disabled   (optional) Lista de entity_id-uri dezactivate post-redenumire
#   references_updated  (optional) Câte referințe au fost actualizate în HA:
#                       automations / scripts / scenes / groups / helpers / dashboards
#   summary             1-3 fraze despre ce s-a făcut și de ce
# -----------------------------------------------------------------------------

change_log:
  - date: "2026-05-28"
    session: "Setup inițial — convenție de denumire + labels + workflow post-redenumire"
    devices_touched: []
    labels_added: []
    entities_disabled: []
    references_updated:
      automations: 0
      scripts: 0
      scenes: 0
      groups: 0
      helpers: 0
      dashboards: 0
    summary: |
      Creat fișierul inventory.yaml și setul de skill-uri HA (ha-devices-areas.md,
      ha-entities.md, etc.), lista canonică de 90 labels (14 categorii) și
      workflow-ul post-redenumire (dezactivare entități nefolosite + verificare
      automations/scripts/scenes/groups/helpers/dashboards). Schema v3:
      device_name fără funcție în RO. Registry-ul așteaptă primul batch real
      de device-uri.
