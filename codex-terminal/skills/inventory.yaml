# =============================================================================
# Home Assistant — Device & Entity Registry
# =============================================================================
#
# Sursa de adevăr pentru toate device-urile, entitățile și labels-urile gestionate
# conform skill-urilor `ha-devices-areas.md` și `ha-entities.md`.
#
# WORKFLOW:
#   1. AI citește acest fișier la începutul fiecărei sesiuni de redenumiri.
#   2. AI actualizează `devices:` și adaugă o intrare în `change_log:` la final.
#   3. Dacă a fost necesar un label nou, AI îl adaugă și în `labels:` și în
#      secțiunea Labels din `ha-devices-areas.md`.
#   4. AI bumpează `last_updated`.
#
# REGULI:
#   - Nu șterge intrări din `devices:` — mută device-urile eliminate în `archived_devices:`.
#   - `change_log` e append-only.
#   - `devices:` sortate alfabetic după `device_name`.
#   - `labels:` grupate pe `category`, alfabetic în interiorul categoriei.
#   - `labels` la nivel de device = listă de slug-uri (nu nume); toate trebuie să existe în `labels:` top-level.
#   - YAML trebuie să rămână parsable — validează cu:
#       python3 -c "import yaml; yaml.safe_load(open('inventory.yaml'))"
#
# =============================================================================

schema_version: 3
last_updated: "2026-05-28"

