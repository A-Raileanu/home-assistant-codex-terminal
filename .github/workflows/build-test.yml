name: Build & Smoke Test

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "codex-terminal/**"
      - ".github/workflows/build-test.yml"
  push:
    branches: [main]
    paths:
      - "codex-terminal/**"
      - ".github/workflows/build-test.yml"

permissions:
  contents: read

concurrency:
  group: build-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: codex-terminal/Dockerfile
          failure-threshold: error
          ignore: DL3006,DL3018

  build:
    name: Build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            build_from: ghcr.io/home-assistant/amd64-base:3.21
          - arch: aarch64
            platform: linux/arm64
            build_from: ghcr.io/home-assistant/aarch64-base:3.21
          - arch: armv7
            platform: linux/arm/v7
            build_from: ghcr.io/home-assistant/armv7-base:3.21
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        if: matrix.arch != 'amd64'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container
        if: github.event_name != 'push'
        uses: docker/build-push-action@v6
        with:
          context: ./codex-terminal
          push: false
          load: ${{ matrix.arch == 'amd64' }}
          platforms: ${{ matrix.platform }}
          tags: test/codex-terminal:${{ matrix.arch }}
          build-args: |
            BUILD_FROM=${{ matrix.build_from }}
          cache-from: type=gha,scope=codex-terminal-${{ matrix.arch }}

      - name: Build container and update cache
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ./codex-terminal
          push: false
          load: ${{ matrix.arch == 'amd64' }}
          platforms: ${{ matrix.platform }}
          tags: test/codex-terminal:${{ matrix.arch }}
          build-args: |
            BUILD_FROM=${{ matrix.build_from }}
          cache-from: type=gha,scope=codex-terminal-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=codex-terminal-${{ matrix.arch }}

      - name: Smoke test - image runs
        if: matrix.arch == 'amd64'
        run: |
          docker run --rm --entrypoint /bin/bash test/codex-terminal:amd64 -c "echo 'Image runs OK'"

      - name: Smoke test - scripts executable
        if: matrix.arch == 'amd64'
        run: |
          docker run --rm --entrypoint /bin/bash test/codex-terminal:amd64 -c '
            for script in \
              /run.sh \
              /opt/scripts/codex-ha.sh \
              /opt/scripts/codex-task-picker.sh \
              /opt/scripts/ha-context.sh \
              /opt/scripts/ha-safe-edit.sh \
              /opt/scripts/persist-install.sh \
              /opt/scripts/setup-ha-mcp.sh \
              /opt/scripts/validate-skills.sh; do
              if [ ! -x "$script" ]; then
                echo "FAIL: $script is not executable"
                exit 1
              fi
              echo "OK: $script"
            done
          '

      - name: Smoke test - key binaries available
        if: matrix.arch == 'amd64'
        run: |
          docker run --rm --entrypoint /bin/bash test/codex-terminal:amd64 -c '
            for bin in codex node npm ttyd tmux git rg jq curl uvx bwrap; do
              if ! command -v "$bin" >/dev/null 2>&1; then
                echo "FAIL: $bin not found"
                exit 1
              fi
              echo "OK: $bin"
            done
          '

      - name: Smoke test - validate bundled skills
        if: matrix.arch == 'amd64'
        run: |
          docker run --rm --entrypoint /bin/bash test/codex-terminal:amd64 -c '
            mkdir -p /tmp/test-skills
            cp -a /opt/skills/. /tmp/test-skills/
            /opt/scripts/validate-skills.sh /tmp/test-skills
          '
