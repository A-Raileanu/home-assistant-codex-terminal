name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, for example v1.0.8"
        required: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        env:
          MANUAL_TAG: ${{ inputs.tag || '' }}
        run: |
          tag="${MANUAL_TAG:-$GITHUB_REF_NAME}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Validate tag matches config.yaml
        run: |
          config_version=$(grep '^version:' codex-terminal/config.yaml | sed 's/version: *"\?\([^"]*\)"\?/\1/')
          tag_version="${{ steps.version.outputs.version }}"
          if [ "$config_version" != "$tag_version" ]; then
            echo "::error::Tag version ($tag_version) does not match config.yaml version ($config_version)"
            exit 1
          fi
          echo "Version $tag_version validated"

      - name: Extract changelog
        run: |
          version="${{ steps.version.outputs.version }}"
          awk -v ver="$version" 'BEGIN{found=0} /^## /{if(found)exit; if($2==ver)found=1; next} found{print}' \
            codex-terminal/CHANGELOG.md > /tmp/changelog.md
          if [ ! -s /tmp/changelog.md ]; then
            echo "Release $version" > /tmp/changelog.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "v${{ steps.version.outputs.version }}"
          body_path: /tmp/changelog.md
          generate_release_notes: false
