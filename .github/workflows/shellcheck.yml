name: ShellCheck

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "codex-terminal/*.sh"
      - "codex-terminal/scripts/*.sh"
      - "codex-terminal/scripts/**/*.sh"
      - ".github/workflows/shellcheck.yml"
  push:
    branches: [main]
    paths:
      - "codex-terminal/*.sh"
      - "codex-terminal/scripts/*.sh"
      - "codex-terminal/scripts/**/*.sh"
      - ".github/workflows/shellcheck.yml"

permissions:
  contents: read

concurrency:
  group: shellcheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SHELLCHECK_OPTS: -s bash
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: ./codex-terminal
          severity: error
